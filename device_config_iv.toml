# IVカーブ測定専用の config。本番 device_config.toml とは別ファイルなので、
# これを置いても運用中の設定は一切変わらない。
#
# 配線は 2026-09-04 の probe_channels.py 掃引（result_2609041454）で確定したもの。
#     v1 -> ch9 / ch10,  h1 -> ch11 / ch12,  h2 -> ch13 / ch14,  v2 -> ch15 / ch16
#     （奇数=電流モニタ、偶数=電圧モニタ）
#
# 注意: TOML のインラインテーブル { } は必ず1行に収めること（改行で tomli が落ちる）。

[sis_bias_setter]
_ = "CPZ3346"
rsw_id = 0
# 0.94/3。本番と同じ値。指令値[mV] * この係数 = DA出力[V]。
# 本番のコメントにある "1/(3*0.94)" は誤り（値は 0.94/3 で正しい）。
conversion_factor = 0.3133333333333333
channel = { v1 = "ch5", v2 = "ch8", h1 = "ch6", h2 = "ch7" }
range = { v1 = "10V", v2 = "10V", h1 = "10V", h2 = "10V" }
tuned = { v1 = 6.9, v2 = 6.5, h1 = 6.5, h2 = 7.4 }

[sis_bias_reader]
_ = "CPZ3177"
rsw_id = 0
all_ch_num = 8
# 登録順が読み出し順になる。リスト末尾の大信号chの残留が先頭chに 0.81 倍で乗る
# 現象を観測しているので、2.86 V 振れる電圧chを先、0.2-0.5 V の電流chを後に置く。
channel = { v1_v = "ch10", v1 = "ch9", v2_v = "ch16", v2 = "ch15", h1_v = "ch12", h1 = "ch11", h2_v = "ch14", h2 = "ch13" }
ch_range = { v1_v = "10V", v1 = "10V", v2_v = "10V", v2 = "10V", h1_v = "10V", h1 = "10V", h2_v = "10V", h2 = "10V" }
# 電流モニタ -500 µA/V（本番と同じ。ギャップ超えで200 µA前後になり妥当）
# 電圧モニタ -2.80 mV/V（2026-09-04 の実測。傾き -0.3573 V/mV の逆数。反転出力）
conversion_factor = { v1_v = -2.80, v1 = -500, v2_v = -2.80, v2 = -500, h1_v = -2.80, h1 = -500, h2_v = -2.80, h2 = -500 }
ave_num = 10
smpl_freq = 1000
smpl_num = 15
single_diff = "DIFF"
