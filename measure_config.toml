# Settings used only by the TZ-tools measurement scripts.
#
# The instruments themselves (addresses, channels, conversions, operating
# values) are read from device_config.toml of TZ-controller, the same file
# initialize.py reads. The first file in this list that exists is used;
# relative paths are taken from the folder of the scripts
# (~/tz_workspace/TZ-tools -> ~/tz_workspace/device_config.toml).
device_config = ["../device_config.toml"]

# The conversion every script checks before anything is sent to the DA board:
# DA output [V] = bias setting [mV] * this.
expected_setter_factor = 0.3546099290780142   # 1 / (3 * 0.94)

[bias]
# Limits on any bias setting of the measurement scripts [mV]
min = 0.0
max = 9.0

[iv]
# IV curve sweep of iv_curve_measure.py [mV junction voltage]. The junction
# must never see less than -5 mV or more than +10 mV (receiver developer).
start = -4.9
stop = 10.0
step = 0.1
settle = 0.05          # s after each step
hard_min = -5.0
hard_max = 10.0

[iv.probe]
# iv_curve_measure.py --probe: positive only, just past the H gap
start = 0.0
stop = 8.0
step = 0.2

[if_switch]
# IF Switch Controller path of each IF band
path = { HU = 105, HL = 106, VU = 107, VL = 108 }

[local_attenuator]
# GPIB port of the LO Att. of each polarization
port = { H = 4, V = 5 }
# Set while the 1st LO is switched, and after the work (receiver developer)
weak = 70.0

[loads]
# Load temperatures for the Y factor [K]
thot = 300.0
tcold = 77.0

[spectrum_analyzer]
# Settings per measurement, from the TZ manual (2026-02, B-2, B-3, B-4).
# Att. and Ref. level are left to the operator.
chopper = { center = "6GHz", span = "0Hz", rbw = "1MHz", vbw = "300Hz", sweep_time = 0.3, scale_type = "LOG", average_onoff = "OFF" }
slider = { center = "6GHz", span = "4GHz", rbw = "1MHz", vbw = "1MHz", scale_type = "LOG", average_num = 20, average_onoff = "ON" }
irr = { center = "6GHz", span = "500kHz", rbw = "300Hz", vbw = "10Hz", scale_type = "LOG", average_num = 5, average_onoff = "ON" }

# All 16 AD channels as raw volts, for iv_curve_measure.py --probe
[ad_all_channels]
_ = "CPZ3177"
rsw_id = 0
channel = { c1 = "ch1", c2 = "ch2", c3 = "ch3", c4 = "ch4", c5 = "ch5", c6 = "ch6", c7 = "ch7", c8 = "ch8", c9 = "ch9", c10 = "ch10", c11 = "ch11", c12 = "ch12", c13 = "ch13", c14 = "ch14", c15 = "ch15", c16 = "ch16" }
ch_range = { c1 = "5V", c2 = "5V", c3 = "5V", c4 = "5V", c5 = "5V", c6 = "5V", c7 = "5V", c8 = "5V", c9 = "5V", c10 = "5V", c11 = "5V", c12 = "5V", c13 = "5V", c14 = "5V", c15 = "5V", c16 = "5V" }
conversion_factor = 1.0
ave_num = 10
smpl_freq = 1000
smpl_num = 15
single_diff = "DIFF"
